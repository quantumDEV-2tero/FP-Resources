<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">FP Library AI and Student Community</title>
<desc id="desc">Sign in to access AI study tools, connect with students, share resources and join study conversations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#061329"/><stop offset=".52" stop-color="#071f46"/><stop offset="1" stop-color="#15104b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#43d9ff"/><stop offset="1" stop-color="#8b7cff"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#102b55" stop-opacity=".96"/><stop offset="1" stop-color="#10153e" stop-opacity=".94"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<rect width="1600" height="760" rx="34" fill="url(#bg)"/>
<circle cx="1290" cy="120" r="190" fill="#3aa9ff" opacity=".10" filter="url(#soft)"/>
<circle cx="500" cy="690" r="180" fill="#806cff" opacity=".09" filter="url(#soft)"/>
<rect x="26" y="26" width="1548" height="708" rx="28" fill="none" stroke="#4aaeff" stroke-opacity=".28"/>
<g font-family="Inter,Arial,sans-serif">
  <rect x="78" y="72" width="270" height="48" rx="24" fill="#0d3768" stroke="#43d9ff" stroke-opacity=".55"/>
  <text x="213" y="103" text-anchor="middle" fill="#bfeeff" font-size="18" font-weight="700">✦ UNLOCK THE FULL EXPERIENCE</text>
