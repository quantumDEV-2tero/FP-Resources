  <text x="78" y="270" fill="url(#accent)" font-size="62" font-weight="800">AI &amp; Student Community</text>
  <text x="78" y="326" fill="#b7cbed" font-size="22">Study smarter, connect with other FP students,</text>
  <text x="78" y="360" fill="#b7cbed" font-size="22">share resources and ask questions together.</text>

  <g transform="translate(78 420)">
    <rect width="235" height="104" rx="18" fill="url(#card)" stroke="#43d9ff" stroke-opacity=".34"/>
    <circle cx="43" cy="51" r="24" fill="#0b5aa4" stroke="#43d9ff"/>
    <text x="43" y="59" text-anchor="middle" fill="#fff" font-size="24">✦</text>
    <text x="82" y="44" fill="#fff" font-size="17" font-weight="700">AI Notebooks</text>
    <text x="82" y="69" fill="#8fb3df" font-size="13">Study with course AI</text>
  </g>
  <g transform="translate(331 420)">
    <rect width="235" height="104" rx="18" fill="url(#card)" stroke="#9b83ff" stroke-opacity=".42"/>
    <circle cx="43" cy="51" r="24" fill="#432d9e" stroke="#a98dff"/>
    <text x="43" y="59" text-anchor="middle" fill="#fff" font-size="23">☏</text>
    <text x="82" y="44" fill="#fff" font-size="17" font-weight="700">Connect &amp; Chat</text>
    <text x="82" y="69" fill="#a9a0d9" font-size="13">Talk with other students</text>
  </g>
  <g transform="translate(78 540)">
    <rect width="235" height="104" rx="18" fill="url(#card)" stroke="#28d8a1" stroke-opacity=".42"/>
