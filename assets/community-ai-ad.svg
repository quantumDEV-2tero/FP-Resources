    <text x="82" y="69" fill="#9edbc9" font-size="13">Notes, files &amp; help</text>
  </g>
  <g transform="translate(331 540)">
    <rect width="235" height="104" rx="18" fill="url(#card)" stroke="#ffbf55" stroke-opacity=".42"/>
    <circle cx="43" cy="51" r="24" fill="#8c5b0b" stroke="#ffbf55"/>
