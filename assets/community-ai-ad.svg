    <text x="359" y="237" text-anchor="middle" fill="#7698c1" font-size="10">STUDENTS</text>
    <rect x="444" y="198" width="142" height="48" rx="12" fill="#0b2c55"/>
    <text x="515" y="220" text-anchor="middle" fill="#a998ff" font-size="17" font-weight="800">120+</text>
    <text x="515" y="237" text-anchor="middle" fill="#7698c1" font-size="10">RESOURCES</text>
    <rect x="600" y="198" width="142" height="48" rx="12" fill="#0b2c55"/>
    <text x="671" y="220" text-anchor="middle" fill="#72e3bd" font-size="17" font-weight="800">24/7</text>
    <text x="671" y="237" text-anchor="middle" fill="#7698c1" font-size="10">COMMUNITY</text>

    <rect x="260" y="297" width="504" height="222" rx="18" fill="#091a34" stroke="#7699c8" stroke-opacity=".18"/>
    <text x="288" y="335" fill="#fff" font-size="18" font-weight="700">Recent discussions</text>
    <g transform="translate(288 360)">
      <circle cx="22" cy="22" r="22" fill="#294c78"/>
      <text x="57" y="18" fill="#fff" font-size="13" font-weight="700">S3 Physics</text>
      <text x="57" y="37" fill="#779bc4" font-size="11">Anyone have a useful summary?</text>
      <text x="444" y="28" text-anchor="end" fill="#5e7da3" font-size="10">2m</text>
    </g>
    <line x1="288" y1="410" x2="736" y2="410" stroke="#7898bd" stroke-opacity=".12"/>
    <g transform="translate(288 424)">
      <circle cx="22" cy="22" r="22" fill="#513f88"/>
      <text x="57" y="18" fill="#fff" font-size="13" font-weight="700">Thermodynamics</text>
      <text x="57" y="37" fill="#779bc4" font-size="11">Looking for a study partner?</text>
      <text x="444" y="28" text-anchor="end" fill="#5e7da3" font-size="10">12m</text>
    </g>
    <rect x="545" y="55" width="185" height="44" rx="22" fill="#102d57" stroke="#43d9ff" stroke-opacity=".35"/>
    <text x="638" y="82" text-anchor="middle" fill="#bcecff" font-size="13" font-weight="700">✦ Let's study together!</text>
  </g>

  <text x="1135" y="696" fill="#79a4d4" font-size="15" text-anchor="middle">Your study journey is better together.</text>
</g>
