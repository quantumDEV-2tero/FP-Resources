    <text x="77" y="296" fill="#7fa8d6" font-size="11">Course assistants</text>
    <rect x="60" y="322" width="154" height="58" rx="14" fill="#102342"/>
    <text x="77" y="347" fill="#fff" font-size="17" font-weight="700">Students</text>
    <text x="77" y="368" fill="#7fa8d6" font-size="11">Connect &amp; chat</text>
    <rect x="60" y="394" width="154" height="58" rx="14" fill="#102342"/>
