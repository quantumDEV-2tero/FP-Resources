    <rect x="24" y="24" width="742" height="58" rx="16" fill="#0c2243"/>
    <circle cx="52" cy="53" r="8" fill="#43d9ff"/><circle cx="78" cy="53" r="8" fill="#8b7cff"/><circle cx="104" cy="53" r="8" fill="#28d8a1"/>
    <text x="132" y="60" fill="#dbeaff" font-size="16" font-weight="700">FP Library • Community</text>

